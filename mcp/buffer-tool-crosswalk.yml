cli_only:
  - command: buffer schema list
    reason: Local schema discovery; no API call.
  - command: buffer schema describe
    reason: >-
      Returns the full JSON Schema for a command's --json payload. This is the
      closest thing Buffer ships to a machine-readable request contract outside
      GraphQL introspection, and it is local to the CLI.
  - command: buffer config get/set/unset
    reason: Local configuration; no API call.
  - command: buffer doctor
    reason: Local environment diagnostics plus a reachability check.
  - command: buffer context / buffer install / buffer uninstall
    reason: >-
      Prints and installs Buffer's own agent skill files (saved verbatim in
      skills/). No API call, no auth required.
  - command: --dry-run on every mutation
    reason: >-
      Validates a payload locally and prints what would be sent, without
      calling the API. Buffer's only dry-run surface.
