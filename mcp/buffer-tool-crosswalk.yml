method: derived
source: graphql/buffer-schema.graphql + graphql/buffer-api-reference.md + cli/buffer-cli.yml
note: >-
  Buffer publishes NO OpenAPI, so this crosswalk binds the agent-facing
  surfaces to GraphQL fields rather than to REST operationIds. Three surfaces
  are in play: the GraphQL API at https://api.buffer.com (the machine-readable
  core), the hosted MCP server at https://mcp.buffer.com/mcp, and the
  first-party CLI (@bufferapp/cli), which is itself generated from the public
  GraphQL schema and is therefore a faithful projection of it. The MCP tool
  names are AUTH-GATED — an anonymous tools/list returns 401 — so every MCP
  row below carries confidence: low and the tool name is the candidate name
  from mcp/buffer-mcp.yml, not a published Buffer tool name. The CLI rows are
  confidence: high because the command surface is documented verbatim at
  https://developers.buffer.com/guides/cli.html and shipped in the package.
surfaces:
  openapi:
    present: false
    note: Buffer publishes no OpenAPI or Swagger document on any host.
  graphql:
    endpoint: https://api.buffer.com
    also_reachable_at: https://api.buffer.com/graphql
    introspection: gated
    introspection_note: >-
      POST {"query":"{__typename}"} returns 401 UNAUTHENTICATED. The schema in
      graphql/buffer-schema.graphql was captured earlier; the current operation
      set is confirmed against the provider's own published reference saved
      verbatim at graphql/buffer-api-reference.md (fetched 2026-08-13).
    local_sdl: graphql/buffer-schema.graphql
    local_reference: graphql/buffer-api-reference.md
  mcp:
    endpoint: https://mcp.buffer.com/mcp
    transport: streamable-http
    tools_list: gated
    tools_list_note: 'HTTP 401 {"error":"Authorization header is required"} on anonymous tools/list.'
  cli:
    package: "@bufferapp/cli"
    version: 1.2.0
    generated_from: the public Buffer GraphQL schema
