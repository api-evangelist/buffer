deployment:
  mode: remote
  endpoint: https://mcp.buffer.com/mcp
  auth: oauth
  auth_alternatives:
    - api-key
  verified: probed
  note: >-
    Remote only. Buffer ships no stdio package and no `npx` install for MCP —
    the MCP surface is a hosted HTTP endpoint an agent POSTs to directly. Two
    credential paths are documented against the same endpoint: OAuth 2.0
    (used by the Claude connector — "Connect Buffer to Claude on the web,
    desktop, or Claude Code using OAuth. No API key needed.") and a static
    Bearer API key (used by the generic MCP, n8n, Cursor and Raycast setups:
    `Authorization: Bearer YOUR_API_KEY`). The OAuth path is backed by real
    RFC 9728 protected-resource metadata at
    https://mcp.buffer.com/.well-known/oauth-protected-resource, which was
    fetched (200) and is saved in well-known/.
server:
  name: buffer
  transport: http
  subtype: streamable-http
  url: https://mcp.buffer.com/mcp
  install_claude_code: claude mcp add --transport http buffer https://mcp.buffer.com/mcp
  authorization_servers:
    - https://auth.buffer.com
  scopes_supported:
    - posts:read
    - posts:write
    - ideas:read
    - ideas:write
    - account:read
    - account:write
    - insights:read
    - engagements:read
    - engagements:write
  bearer_methods_supported: [header]
tools:
  status: gated
  note: >-
    NOT FABRICATED. An anonymous POST of {"jsonrpc":"2.0","id":1,
    "method":"tools/list"} to https://mcp.buffer.com/mcp returns HTTP 401
    {"error":"Authorization header is required","httpCode":401}, so the live
    tool list with real inputSchemas requires an authenticated introspection.
    Buffer publishes no tool list in its docs or llms.txt either. The tools
    below are therefore NOT recorded as the server's tool set — they are the
    operations the server can plausibly expose, taken from the published
    GraphQL contract and the first-party CLI's command surface, and every row
    is marked candidate. Do not treat these as Buffer's published tool names.
  probe:
    url: https://mcp.buffer.com/mcp
    method: POST
    http_status: 401
    body: '{"error":"Authorization header is required","httpCode":401}'
    fetched: '2026-08-13'
