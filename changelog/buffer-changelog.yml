scheme:
  versioning: none
  entry_key: date
  detail: >-
    Buffer publishes no version numbers. The changelog is a dated, per-schema-
    change log — several entries can share a date with different times — and
    each entry classifies changes as Added / Changed / Deprecated / Removed
    against named GraphQL types and fields. Because the API is additive-only,
    "Removed" entries are rare and always follow a prior deprecation.
