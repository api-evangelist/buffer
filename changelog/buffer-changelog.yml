observations:
  - >-
    Cadence is high — roughly 30 dated entries in the ten weeks captured, often
    several per day.
  - >-
    Removals do occur despite the additive-only policy, but every removal in
    the window followed a prior deprecation or was same-week churn on a value
    added days earlier.
  - >-
    The changelog is the ONLY channel for deprecation notice besides the
    @deprecated reason string — Buffer emits no Sunset/Deprecation headers.
