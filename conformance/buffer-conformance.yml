event_surface:
  present: false
  detail: >-
    Buffer publishes no webhooks, no GraphQL subscriptions and no streaming
    endpoint. The schema declares only `schema { query, mutation }` — there is
    no subscription root. The word "webhook" appears nowhere in the docs corpus
    (all guides, reference, llms.txt and the CLI package were grepped). Event
    delivery in Buffer's own integration story is handled by third-party
    automation (Zapier, n8n) polling the API. This is a true N/A, not a gap
    left unmeasured — no AsyncAPI or Webhooks artifact is emitted.
compliance_program:
  published: true
  url: https://buffer.com/security
  frameworks: [GDPR, EU-US/UK/Swiss Data Privacy Frameworks, CCPA]
  certifications: []
  trust_center: false
  note: >-
    Buffer publishes a privacy/data-protection compliance program but no
    security certifications and no trust center. The Compliance pointer in
    apis.yml points at the published policies page for that reason; no
    TrustCenter pointer is emitted.
