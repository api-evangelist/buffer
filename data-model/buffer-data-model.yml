notes:
  - >-
    There is no `render` in this repo — no subway/ diagram exists for Buffer.
  - >-
    Every entity is scoped to an Organization. Channel, Post and Idea all carry
    an organizationId either directly or through their parent, and the posts /
    channels / aggregatedPostMetrics queries all require organizationId as
    input, so organization is the effective tenancy boundary of the API.
