versioning:
  scheme: none
  current: null
  policy: additive-only
  docs: https://developers.buffer.com/guides/api-standards.html
  detail: >-
    Buffer runs one evergreen GraphQL endpoint with no version in the path,
    no version header and no dated release train. The stability contract is
    "Always Add, Never Modify or Remove": new fields and types are added
    alongside existing ones, so existing queries keep working.
maturity_markers:
  - marker: '🧪 Preview'
    applies_to: [createPostTemplate, updatePostTemplate, deletePostTemplate, postTemplate, postTemplates]
    source: https://developers.buffer.com/reference.html
  - marker: '⚠️ Experimental'
    applies_to: [movePostInQueue]
    source: https://developers.buffer.com/reference.html
  - marker: '@experimental'
    applies_to: [Post.metrics, aggregatedPostMetrics]
    source: skills/buffer-post-metrics.md
    note: '"Schema is @experimental: the shape can change without notice."'
  - marker: Beta
    applies_to: ["Query 'Ideas'"]
    source: https://developers.buffer.com/roadmap.html
deprecation:
  policy_url: https://developers.buffer.com/guides/api-standards.html
  mechanism: GraphQL '@deprecated(reason:)'
  sunset_header: false
  rfc8594: false
  statement: >-
    "When we plan to retire a field, we mark it with the @deprecated
    annotation. Deprecated fields include a reason that describes the
    replacement and when the field will be removed. You'll always have advance
    notice before a field is removed."
  notice_channel: the @deprecated reason string plus the dated changelog
  detail: >-
    Buffer does NOT emit RFC 8594 Sunset/Deprecation HTTP headers — the whole
    deprecation contract lives in the schema annotation and the changelog.
    Removal dates have been extended in practice at least once (see below),
    which is a caller-friendly signal rather than a violation.
