retirements:
  - product: Buffer legacy REST API
    status: announced
    retirement_date: '2027-02-01'
    announced: '2026-07-27'
    announcement_url: https://buffer.com/resources/legacy-rest-api-retired/
    statement: >-
      "We're retiring Buffer's legacy REST API on February 1, 2027. After that
      date, requests to legacy endpoints will no longer return data."
    migration_guide: https://developers.buffer.com/guides/rest-migration.html
    residue_in_current_api: >-
      The GraphQL schema still carries RestProxyError, which proxies a legacy
      REST error code and links to https://buffer.com/developers/api/errors —
      that registry retires with the legacy API.
  - product: StartPage post metadata
    status: removed
    removed_on: '2026-05-26'
    detail: StartPagePostMetadata / StartPagePostMetadataInput and the union member were removed.
